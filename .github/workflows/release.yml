name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get release notes from Changelog.md
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["GITHUB_REF_NAME"]

          with open("Changelog.md", encoding="utf-8") as f:
              text = f.read()

          # 匹配形如“### v4.4”的标题，提取其内容直到下一个标题（或文件末尾）
          match = re.search(
              r"^#{1,6}[ \t]+" + re.escape(tag) + r"[ \t]*\n(.*?)(?=\n#{1,6}[ \t]|\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          if not match:
              raise SystemExit(
                  f"::error::Changelog.md 中没有版本 {tag} 的内容，请先添加形如“### {tag}”的标题"
              )

          body = match.group(1).strip()
          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write(body + "\n")

          print(f"已提取 {tag} 的更新内容（{len(body)} 字符）")
          PY

      - name: Package
        run: |
          mkdir -p package/ChsMod
          cp -r README.md Changelog.md LICENSE localization.json optionsMenuItems.json lovely.toml fonts icons package/ChsMod/
          cd package
          zip -r -9 "../Beatblock-ChsMod-${GITHUB_REF_NAME}.zip" ChsMod
          unzip -l "../Beatblock-ChsMod-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-file release_body.md \
            --title "${GITHUB_REF_NAME}" \
            "Beatblock-ChsMod-${GITHUB_REF_NAME}.zip"
